name: Build unsigned IPA (사이드로딩용)

on:
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project (Expo prebuild)
        run: npx expo prebuild -p ios
        env:
          CI: "1"

      - name: Build app (unsigned)
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -workspace Berong.xcworkspace \
            -scheme Berong \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry berong.ipa Payload
          ls -la berong.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: berong-ipa
          path: berong.ipa
          retention-days: 30
